<!DOCTYPE html>
<html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLC V12 AUTH</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>.radar{width:100%;height:160px;background:radial-gradient(circle at center, #1e293b 0%, #020617 100%);border-radius:16px;position:relative;overflow:hidden}.radar-sweep{position:absolute;top:50%;left:50%;width:50%;height:2px;background:linear-gradient(90deg, transparent, #22c55e);transform-origin:left;animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.call-overlay{position:fixed;inset:0;z-index:9999;background:#000}</style>
</head>
<body class="bg-[#f0f2f5]">
<!-- AUTH SCREEN -->
<div id="authScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-600 to-purple-600">
<div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
<h1 class="font-bold text-2xl text-center">NLC Connect V12</h1><p class="text-center text-xs text-gray-500 mt-1">နိုင်ငံတကာ Login</p>
<div class="mt-6 space-y-3">
<!-- GOOGLE -->
<button onclick="loginGoogle()" class="w-full border-2 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5"> Google နဲ့ ဝင်မယ်</button>
<div class="flex items-center gap-2 my-2"><div class="flex-1 h-[1px] bg-gray-200"></div><p class="text-[11px] text-gray-400">သို့မဟုတ်</p><div class="flex-1 h-[1px] bg-gray-200"></div></div>
<!-- PHONE -->
<p class="font-bold text-xs">📱 ဖုန်းနံပါတ်နဲ့</p><div class="flex gap-2"><select id="countryCode" class="border rounded-xl px-2 py-2.5 text-sm bg-gray-50"><option value="+95">🇲 +95</option><option value="+66">🇹🇭 +66</option><option value="+1">🇺🇸 +1</option><option value="+81">🇯🇵 +81</option><option value="+82">🇰🇷 +82</option><option value="+65">🇸🇬 +65</option><option value="+60">🇲🇾 +60</option></select><input id="phoneNum" placeholder="9xxxxxxxx" class="flex-1 border rounded-xl px-3 py-2.5 text-sm"></div><div id="recaptcha"></div><button onclick="sendOTP()" id="otpBtn" class="w-full bg-black text-white py-2.5 rounded-xl text-sm font-bold">SMS Code ပို့မယ်</button><div id="otpBox" class="hidden"><input id="otpCode" placeholder="SMS Code 6 လုံး" class="w-full border-2 rounded-xl px-3 py-2.5 text-sm text-center tracking-widest"><button onclick="verifyOTP()" class="w-full bg-green-600 text-white py-2.5 rounded-xl text-sm font-bold mt-2">Verify</button></div>
<div class="flex items-center gap-2 my-3"><div class="flex-1 h-[1px] bg-gray-200"></div><p class="text-[11px] text-gray-400">သို့မဟုတ်</p><div class="flex-1 h-[1px] bg-gray-200"></div></div>
<!-- EMAIL PASS -->
<p class="font-bold text-xs">🔑 Password နဲ့</p><input id="email" placeholder="Email" class="w-full border rounded-xl px-3 py-2.5 text-sm"><input id="pass" type="password" placeholder="Password (6 လုံးအထက်)" class="w-full border rounded-xl px-3 py-2.5 text-sm mt-2"><div class="flex gap-2 mt-2"><button onclick="signUpEmail()" class="flex-1 bg-indigo-100 text-indigo-600 py-2.5 rounded-xl text-sm font-bold">Sign Up</button><button onclick="loginEmail()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-bold">Login</button></div>
<p id="authMsg" class="text-xs text-center mt-3 text-red-500"></p>
</div>
</div>
</div>

<!-- MAIN APP (V10.2 + V11 Features) -->
<div id="mainApp" class="hidden max-w-6xl mx-auto md:grid md:grid-cols-12 h-screen">
<div class="md:col-span-4 bg-white flex flex-col border-r">
<div class="p-3 border-b flex items-center gap-3"><div id="pAv" class="w-10 h-10 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold">N</div><div class="flex-1"><p id="pName" class="font-bold text-sm"></p><p id="pEmail" class="text-[10px] text-gray-500"></p><p id="pLoc" class="text-[10px] text-blue-600">📍 Locating...</p></div><button onclick="doLogout()" class="text-xs border px-3 py-1 rounded-full">Logout</button></div>
<div id="requestsBox" class="p-2 bg-yellow-100 border-b hidden"><div id="requestsList" class="space-y-1"></div></div>
<div class="flex bg-gray-100 m-2 rounded-xl p-1"><button onclick="showLeft('all')" id="lbAll" class="flex-1 py-2 text-xs font-bold bg-white rounded-lg shadow">All</button><button onclick="showLeft('friends')" id="lbFriends" class="flex-1 py-2 text-xs font-bold text-gray-500">Friends</button><button onclick="showLeft('online')" id="lbOnline" class="flex-1 py-2 text-xs font-bold text-gray-500">Near</button></div>
<div id="leftAll" class="flex-1 overflow-y-auto p-2"></div><div id="leftFriends" class="hidden flex-1 overflow-y-auto p-2"></div><div id="leftOnline" class="hidden flex-1 overflow-y-auto p-2"></div>
</div>
<div class="md:col-span-8 flex flex-col overflow-hidden"><div class="flex bg-white border-b"><button id="bFeed" onclick="showMain('feed')" class="flex-1 py-3 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600">Feed + Real GPS</button><button id="bChat" onclick="showMain('chat')" class="flex-1 py-3 font-bold text-sm text-gray-400">Chat + Location</button></div><div id="tabFeed" class="flex-1 overflow-y-auto p-3 space-y-3"><div class="bg-[#020617] rounded-2xl p-3 text-white"><div class="flex justify-between"><p class="font-bold text-xs">🛰️ REAL RADAR</p><span id="radarStatus" class="text-[10px] bg-green-500 px-2 py-1 rounded-full">0</span></div><div class="radar mt-2" id="radarBox"><div class="radar-sweep"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 bg-white rounded-full -translate-x-1/2 -translate-y-1/2"></div></div></div><div class="bg-white rounded-2xl p-3 shadow-sm"><textarea id="postText" placeholder="Post + Location..." class="w-full bg-gray-100 rounded-xl p-3 text-sm"></textarea><div class="flex justify-between mt-2"><button onclick="addPostLocation()" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full text-xs font-bold">📍 Location</button><button onclick="createPost()" id="postBtn" class="bg-indigo-600 text-white px-5 py-1.5 rounded-full text-xs font-bold">Post</button></div><p id="postLocLabel" class="hidden text-xs text-blue-600 mt-1">📍 Location added</p></div><div id="feed"></div></div><div id="tabChat" class="hidden flex-1 flex-col bg-white"><div class="p-3 border-b flex items-center gap-3"><div id="cAv" class="w-9 h-9 bg-gray-200 rounded-full flex items-center justify-center font-bold">?</div><p id="cName" class="font-bold text-sm">Friend ရွေးပါ</p><div class="ml-auto flex gap-1"><button onclick="sendLocation()" class="w-9 h-9 bg-blue-100 text-blue-600 rounded-full"><i class="fa fa-location-dot"></i></button><button onclick="startVideo()" class="w-9 h-9 bg-indigo-100 rounded-full"><i class="fa fa-video"></i></button></div></div><div id="chatMsgs" class="flex-1 overflow-y-auto p-3 space-y-2 bg-[#f0f2f5]"></div><div class="p-3 flex gap-2"><input id="chatInput" placeholder="စာရိုက်..." class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm"><button onclick="sendMsg()" class="bg-indigo-600 text-white w-10 h-10 rounded-full"><i class="fa fa-paper-plane"></i></button></div></div></div>
</div>
<div id="callOverlay" class="hidden call-overlay"><video id="remoteVideo" autoplay class="w-full h-full object-cover"></video><video id="myVideo" autoplay muted class="absolute top-4 right-4 w-28 h-40 bg-gray-800 rounded-2xl border-2 border-white object-cover"></video><div class="absolute bottom-0 w-full bg-[#1a1a1a] p-6 flex justify-center"><button onclick="endCall()" class="w-14 h-14 bg-red-600 rounded-full text-white"><i class="fa fa-phone"></i></button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const cfg={apiKey:"AIzaSyDp6AhMjl-0-o_0fPDPjU3LxNnHg4EDV4g",authDomain:"nlc-connect-13-9-2026.firebaseapp.com",databaseURL:"https://nlc-connect-13-9-2026-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"nlc-connect-13-9-2026",storageBucket:"nlc-connect-13-9-2026.firebasestorage.app",messagingSenderId:"364424177320",appId:"1:364424177320:web:d7de419012373079d1849d"};
const app=initializeApp(cfg); const db=getDatabase(app); const auth=getAuth(app);
let me=null, myLat=null, myLng=null, postLat=null, postLng=null, peer=null, localStream=null, currentChatId=null, currentFriend=null, confirmationResult=null;
auth.languageCode='my';
window.recaptchaVerifier=new RecaptchaVerifier(auth,'recaptcha',{size:'invisible'});

onAuthStateChanged(auth, user=>{
  if(user){
    me={id:user.uid, name:user.displayName||user.email||user.phoneNumber||'NLC User', email:user.email||user.phoneNumber, photo:user.photoURL};
    navigator.geolocation.getCurrentPosition(p=>{ myLat=p.coords.latitude; myLng=p.coords.longitude; me.lat=myLat; me.lng=myLng; document.getElementById('pLoc').innerText=`📍 ${myLat.toFixed(4)}, ${myLng.toFixed(4)}`; set(ref(db,'v12_users/'+me.id),{...me,lastSeen:Date.now()}); set(ref(db,'v10_online/'+me.id),{...me,t:Date.now()}); }, ()=>{});
    document.getElementById('authScreen').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); document.getElementById('mainApp').classList.add('grid');
    document.getElementById('pName').innerText=me.name; document.getElementById('pEmail').innerText=me.email; document.getElementById('pAv').innerText=me.name[0].toUpperCase();
    setupPeer(); loadAll();
  } else {
    document.getElementById('authScreen').classList.remove('hidden'); document.getElementById('mainApp').classList.add('hidden');
  }
});

window.loginGoogle=async()=>{ const provider=new GoogleAuthProvider(); try{ await signInWithPopup(auth,provider); }catch(e){ document.getElementById('authMsg').innerText=e.message; } };
window.sendOTP=async()=>{
  const code=document.getElementById('countryCode').value; const num=document.getElementById('phoneNum').value.trim(); if(!num) return alert('ဖုန်းနံပါတ်ထည့်');
  const full=code+num; document.getElementById('otpBtn').innerText='Sending...';
  try{ confirmationResult=await signInWithPhoneNumber(auth,full,window.recaptchaVerifier); document.getElementById('otpBox').classList.remove('hidden'); document.getElementById('authMsg').innerText='SMS Code ပို့ပြီးပြီ!'; document.getElementById('otpBtn').innerText='ပို့ပြီး'; }catch(e){ document.getElementById('authMsg').innerText=e.message; document.getElementById('otpBtn').innerText='SMS Code ပို့မယ်'; }
};
window.verifyOTP=async()=>{ const code=document.getElementById('otpCode').value.trim(); try{ await confirmationResult.confirm(code); }catch(e){ document.getElementById('authMsg').innerText='Code မှားနေတယ်: '+e.message; } };
window.signUpEmail=async()=>{ const e=document.getElementById('email').value; const p=document.getElementById('pass').value; try{ await createUserWithEmailAndPassword(auth,e,p); document.getElementById('authMsg').innerText='Sign Up အောင်မြင်ပြီ! Auto Login ဝင်သွားမယ်'; }catch(err){ document.getElementById('authMsg').innerText=err.message; } };
window.loginEmail=async()=>{ const e=document.getElementById('email').value; const p=document.getElementById('pass').value; try{ await signInWithEmailAndPassword(auth,e,p); }catch(err){ document.getElementById('authMsg').innerText=err.message; } };
window.doLogout=()=>signOut(auth).then(()=>location.reload());

// === MAIN APP LOGIC (V10.2 + V11) ===
function loadAll(){ loadFeed(); loadUsers(); loadFriends(); loadRequests(); loadRadar(); }
window.showMain=function(t){ document.getElementById('tabFeed').classList.toggle('hidden',t!=='feed'); document.getElementById('tabFeed').classList.toggle('flex',t==='feed'); document.getElementById('tabChat').classList.toggle('hidden',t!=='chat'); document.getElementById('
