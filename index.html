<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NLC Connect V12</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    body{background:#05070a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:linear-gradient(180deg,#12151c 0%,#0a0c10 100%);border:1px solid #1e232e;border-radius:24px;padding:32px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .logo{font-size:28px;font-weight:800;text-align:center;margin-bottom:8px;background:linear-gradient(90deg,#6ee7b7,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sub{text-align:center;color:#8a92a5;font-size:14px;margin-bottom:28px}
    .btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;transition:.2s}
    .btn-google{background:#fff;color:#111}
    .btn-facebook{background:#1877F2;color:#fff}
    .btn-apple{background:#000;color:#fff;border:1px solid #222}
    .btn:hover{transform:translateY(-1px);opacity:.95}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#4b5468;font-size:12px}
    .divider:before,.divider:after{content:"";flex:1;height:1px;background:#1e232e}
    .input{width:100%;padding:14px 16px;border-radius:12px;background:#0e1117;border:1px solid #1e232e;color:#fff;margin-bottom:12px;outline:none}
    .input:focus{border-color:#3b82f6}
    .login{background:linear-gradient(90deg,#3b82f6,#10b981);color:#fff}
    .footer{text-align:center;margin-top:20px;color:#5a647a;font-size:12px}
    #user{ display:none; text-align:center }
    #user img{ width:80px; height:80px; border-radius:50%; margin-bottom:12px }
  </style>
</head>
<body>
  <div class="card">
    <div id="auth">
      <div class="logo">NLC CONNECT</div>
      <div class="sub">V12 INTERNATIONAL LOGIN EDITION</div>
      
      <button class="btn btn-google" onclick="login('google')">🌐 Continue with Google</button>
      <button class="btn btn-facebook" onclick="login('facebook')">📘 Continue with Facebook</button>
      <button class="btn btn-apple" onclick="login('apple')">🍎 Continue with Apple</button>
      
      <div class="divider">OR</div>
      
      <input class="input" id="email" placeholder="Email address" />
      <input class="input" id="pass" type="password" placeholder="Password" />
      <button class="btn login" onclick="emailLogin()">Log In</button>
      
      <div class="footer">Secure • International • V12</div>
    </div>
    
    <div id="user">
      <img id="avatar" src="" />
      <h2 id="name"></h2>
      <p id="emailShow" style="color:#8a92a5;margin:8px 0 20px"></p>
      <button class="btn login" onclick="logout()">Log Out</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider, OAuthProvider, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDUMMY-REPLACE-WITH-YOURS",
      authDomain: "nlc-connect.firebaseapp.com",
      projectId: "nlc-connect",
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    window.login = async (type) => {
      let provider;
      if(type==='google') provider = new GoogleAuthProvider();
      if(type==='facebook') provider = new FacebookAuthProvider();
      if(type==='apple') provider = new OAuthProvider('apple.com');
      try { await signInWithPopup(auth, provider); } catch(e){ alert(e.message) }
    }
    
    window.emailLogin = async () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('pass').value;
      try { await signInWithEmailAndPassword(auth, e, p); } catch(err){ alert(err.message) }
    }
    
    window.logout = () => signOut(auth);
    
    onAuthStateChanged(auth, (user) => {
      if(user){
        document.getElementById('auth').style.display='none';
        document.getElementById('user').style.display='block';
        document.getElementById('name').innerText = user.displayName || 'Welcome';
        document.getElementById('emailShow').innerText = user.email;
        document.getElementById('avatar').src = user.photoURL || 'https://i.pravatar.cc/100';
      } else {
        document.getElementById('auth').style.display='block';
        document.getElementById('user').style.display='none';
      }
    });
  </script>
</body>
</html>
